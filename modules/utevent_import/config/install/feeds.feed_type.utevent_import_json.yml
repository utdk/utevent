id: utevent_import_json
label: 'Events import JSON'
description: 'Imports a JSON file to the Event content type.'
help: ''
import_period: 3600
fetcher: http
fetcher_configuration:
  auto_detect_feeds: false
  use_pubsubhubbub: false
  always_download: false
  fallback_hub: ''
  request_timeout: 30
parser: jsonpath
parser_configuration:
  context:
    value: '$.*'
  source_encoding:
    - auto
  display_errors: false
  line_limit: 100
processor: 'entity:node'
processor_configuration:
  values:
    type: utevent_event
  langcode: en
  insert_new: 1
  update_existing: 2
  update_non_existent: _keep
  skip_hash_check: false
  skip_validation: false
  skip_validation_types: {  }
  authorize: true
  revision: false
  expire: -1
  owner_feed_author: false
  owner_id: 1
custom_sources:
  utevent_uuid_json:
    value: uuid
    label: UUID
    machine_name: utevent_uuid_json
    type: json
  utevent_title_json:
    value: title
    label: Title
    machine_name: utevent_title_json
    type: json
  utevent_path_json:
    value: path
    label: Path
    machine_name: utevent_path_json
    type: json
  utevent_start_json:
